name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # The whole point of keeping the math and the scheduler torch-free:
      # this suite runs on a CPU runner in seconds.
      - run: ruff check servlab tests
      - run: pytest -q
